name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - arena/019f8572-pondok-pay

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pondokpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pondokpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prisma client generation is intentionally explicit; deployment migrations remain separate.
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm test
        env:
          RUN_DB_INTEGRATION: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondokpay_test
          REDIS_URL: redis://localhost:6379
          RUN_REDIS_INTEGRATION: '1'
      - run: npm run build --workspaces
