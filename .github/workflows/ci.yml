name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - 'arena/**'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pondokpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pondokpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      # actions/*@v5 targets the current GitHub Actions runtime and avoids the Node.js 20 deprecation warning.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          RUN_DB_INTEGRATION: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pondokpay_test
          REDIS_URL: redis://localhost:6379
          RUN_REDIS_INTEGRATION: '1'
          JWT_ACCESS_SECRET: 01234567890123456789012345678901
          JWT_REFRESH_SECRET: 01234567890123456789012345678901
      - run: npm run build
